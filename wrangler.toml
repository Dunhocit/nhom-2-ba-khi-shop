name = "nhom2-ba-khi-fashion"
main = "backend/src/index.ts"
compatibility_date = "2025-01-15"

[ai]
binding = "AI"
remote = true

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "fashion_db"
database_id = "115a1bc7-4a78-4a6a-8c95-9f082413ca00"
migrations_dir = "backend/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "a551e0d5df11345caa3b9e93381e8f1f6"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "nhom2-ba-khi-images"

[[vectorize]]
binding = "VECTORIZE"
index_name = "ba-khi-knowledge"
remote = true
